server {
    listen 80;

    # Homepage statis (Menu Utama Lobby)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # === LUXOPTIC ===
    location /luxoptic/ {
        alias /usr/share/nginx/html/luxoptic/;
        index index.html;
        try_files $uri $uri/ @luxoptic_fallback;
    }

    location @luxoptic_fallback {
        root /usr/share/nginx/html;
        rewrite ^ /luxoptic/index.html break;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
    }

    # === ARC ===
    location /arc/ {
        alias /usr/share/nginx/html/arc/;
        index index.html;
        try_files $uri $uri/ @arc_fallback;
    }

    location @arc_fallback {
        root /usr/share/nginx/html;
        rewrite ^ /arc/index.html break;
    }

    location /arc-api/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50M;

        proxy_connect_timeout 900;
        proxy_send_timeout 900;
        proxy_read_timeout 900;
        send_timeout 900;
    }

    # === HRIS ===
    location /hris/ {
        alias /usr/share/nginx/html/hris/;
        index index.html;
        try_files $uri $uri/ @hris_fallback;
    }

    location @hris_fallback {
        root /usr/share/nginx/html;
        rewrite ^ /hris/index.html break;
    }

    location /hris-api/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # === MONEY PRINTER TURBO (WEB UI) ===
    location /mpt/ {
        proxy_pass http://127.0.0.1:8501/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Konfigurasi mutlak yang diwajibkan oleh Streamlit (WebSocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400; # Cegah koneksi putus saat render video
    }

    # === MONEY PRINTER TURBO (API) ===
    location /mpt-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Video generator butuh batas unggah/unduh ekstra besar
        client_max_body_size 500M;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }


}
