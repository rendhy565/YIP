services:
  backend-staging:
    build: ./backend
    container_name: arc-backend-staging
    restart: unless-stopped
    env_file: [./backend/.env.staging]
    ports:
      - "8002:8000"
    networks:
      - luxoptic-net

  frontend-staging:
    image: nginx:alpine
    container_name: arc-frontend-staging
    ports:
      - "8005:80"
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
    networks:
      - luxoptic-net

networks:
  luxoptic-net:
    external: true
    name: luxoptic_luxoptic-net
